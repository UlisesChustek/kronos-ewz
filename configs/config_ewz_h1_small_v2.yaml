data:
  data_path: "__PROJECT_ROOT__/data/processed/ewz_h1.csv"
  lookback_window: 512
  predict_window: 24
  max_context: 512
  clip: 5.0
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  tokenizer_epochs: 30
  basemodel_epochs: 30
  batch_size: 32
  log_interval: 50
  num_workers: 6
  seed: 42
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.00001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "__PROJECT_ROOT__/pretrained/Kronos-Tokenizer-base"
  pretrained_predictor: "__PROJECT_ROOT__/pretrained/Kronos-small"
  exp_name: "ewz_h1_small_v2"
  base_path: "__PROJECT_ROOT__/finetuned"
  base_save_path: ""
  finetuned_tokenizer: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_ewz_h1_v2"
  description: "EWZ hourly fine-tune v2: lookback-only normalization, GPU1, 1e-5 predictor LR, 30 epochs"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 1
